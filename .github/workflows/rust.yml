name: Rust

# rust_libs/ 的 Rust 单元测试、第三方许可声明复查和独立更新器编译。
# 这些 crate 由 C++ 版经 cpp/native 静态链接，不再单独发布。
on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      # 只跑测试，不需要发布级的链接期优化
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}

      - name: Record toolchain versions
        run: |
          rustc -V
          cargo -V
          $hostLine = rustc -vV | Select-String '^host:'
          if ($hostLine -notmatch '${{ matrix.rust-target }}') {
            throw "Rust host does not match ${{ matrix.rust-target }}: $hostLine"
          }

      - id: cache-key
        name: Identify Rust toolchain cache
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationVersion
          $rust = rustc -V
          "CI_TOOLCHAIN=$vs|$rust" >> $env:GITHUB_ENV
          python scripts/ci_build_cache.py key --kind rust --arch ${{ matrix.arch }} --toolchain "$vs|$rust" --github-output $env:GITHUB_OUTPUT
      - name: Restore successful Rust test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_build_cache.py restore --kind rust --arch ${{ matrix.arch }} --toolchain "$env:CI_TOOLCHAIN" --destination cpp/build/ci-rust-${{ matrix.arch }}
      - name: Select cached Cargo directories
        run: |
          "CARGO_HOME=${{ github.workspace }}/cpp/build/ci-rust-${{ matrix.arch }}/cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=${{ github.workspace }}/cpp/build/ci-rust-${{ matrix.arch }}/target" >> $env:GITHUB_ENV

      - name: Run Rust unit tests
        run: cargo test --locked --workspace --release --target ${{ matrix.rust-target }} --manifest-path rust_libs/Cargo.toml

      - name: Reuse or install cargo-about
        if: matrix.arch == 'x64'
        run: |
          $toolRoot = "${{ github.workspace }}/cpp/build/ci-rust-${{ matrix.arch }}/tools"
          $binary = Join-Path $toolRoot 'bin/cargo-about.exe'
          if (-not (Test-Path -LiteralPath $binary)) {
            cargo install cargo-about --locked --features cli --root $toolRoot
            if ($LASTEXITCODE -ne 0) { throw 'cargo-about installation failed' }
          }
          (Join-Path $toolRoot 'bin') >> $env:GITHUB_PATH

      - name: Check third-party notices are current
        if: matrix.arch == 'x64'
        # C++ 发布包静态链接这些 Rust 依赖，MIT/BSD/ISC 等都要求随分发附上版权声明与许可全文
        # （cpp/scripts/build.ps1 把各 crate 的声明拷进包里）。声明文件提交在仓库里，依赖一变就会过期，
        # 每次带标签发布均复查依赖许可。
        #
        # 比的是依赖清单而非文件字节：cargo about 的块顺序在不同机器上不稳定，
        # 按字节比会误判。而 crates.io 上同一版本的内容不可变，所以
        # 「哪个 crate 的哪个版本用哪个许可证」这份清单一致，就等价于声明未过期。
        run: |
          $stale = $false
          foreach ($crate in "gifrecorder", "longstitch", "pyclipboard", "ppocr_rust", "hdrcapture", "updater", "video_recorder") {
            $fresh = Join-Path $env:RUNNER_TEMP "$crate-notices.txt"
            $template = if ($crate -in "updater", "video_recorder") { "rust_libs/$crate/notices.hbs" } else { "rust_libs/notices.hbs" }
            cargo about generate --manifest-path rust_libs/$crate/Cargo.toml -o $fresh $template
            if ($LASTEXITCODE -ne 0) { throw "$crate 的许可声明生成失败" }
            $committed = (Select-String -Path "rust_libs/$crate/THIRD-PARTY-NOTICES.txt" -Pattern '^Applies to: ').Line | Sort-Object
            $current = (Select-String -Path $fresh -Pattern '^Applies to: ').Line | Sort-Object
            $diff = Compare-Object $committed $current
            if ($diff) {
              $stale = $true
              Write-Host "::error::$crate 的第三方许可声明已过期"
              $diff | ForEach-Object {
                $where = if ($_.SideIndicator -eq "<=") { "已提交但依赖树中已无" } else { "依赖树中新增但未声明" }
                Write-Host "    $where : $($_.InputObject)"
              }
            }
          }
          if ($stale) {
            Write-Host "重新生成的方法见 rust_libs/NOTICES.md"
            exit 1
          }
          Write-Host "全部包的第三方许可声明均为最新"

      - name: Build independent updater
        run: cargo rustc --locked --release --target ${{ matrix.rust-target }} --manifest-path rust_libs/Cargo.toml -p jietuba-updater --bin jietuba_updater -- -C target-feature=+crt-static

      - id: cache-pack
        name: Save successful Rust compiler artifacts and tools
        continue-on-error: true
        run: python scripts/ci_build_cache.py pack --kind rust --arch ${{ matrix.arch }} --toolchain "$env:CI_TOOLCHAIN" --source cpp/build/ci-rust-${{ matrix.arch }} --bundle "$env:RUNNER_TEMP/rust-cache"
      - if: steps.cache-pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.cache-key.outputs.key }}
          path: ${{ runner.temp }}/rust-cache/
          compression-level: 0
          overwrite: true
          retention-days: 90
