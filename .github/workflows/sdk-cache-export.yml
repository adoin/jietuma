name: Qt SDK cache export

# Only callable here. A one-time export on the old cache branch needs explicit
# authorization before that branch is given a temporary workflow_dispatch entry.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  export:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: cpp/.sdk/6.11.0/msvc2022_${{ matrix.arch == 'x64' && '64' || 'arm64' }}_static
          key: static-qt-6.11.0-${{ matrix.arch }}-${{ hashFiles('cpp/scripts/build_static_qt.ps1') }}
          fail-on-cache-miss: true
      - id: key
        run: python scripts/ci_build_cache.py key --kind qt --arch ${{ matrix.arch }} --github-output $env:GITHUB_OUTPUT
      - name: Pack existing SDK without compiling
        run: python scripts/ci_build_cache.py pack --kind qt --arch ${{ matrix.arch }} --source cpp/.sdk/6.11.0/msvc2022_${{ matrix.arch == 'x64' && '64' || 'arm64' }}_static --bundle "$env:RUNNER_TEMP/sdk-export"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/sdk-export/
          compression-level: 0
          retention-days: 90
