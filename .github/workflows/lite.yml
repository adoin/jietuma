name: Single exe packages

on:
  workflow_call:
    inputs:
      release_ref:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh
    working-directory: .

jobs:
  branding:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.brand.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - id: brand
        shell: bash
        run: echo "name=$(python3 -c 'import json; print(json.load(open("branding.json"))["name"])')" >> "$GITHUB_OUTPUT"

  qt-x64:
    runs-on: windows-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: key
        run: python scripts/ci_build_cache.py key --kind qt --arch x64 --github-output $env:GITHUB_OUTPUT
      - id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_build_cache.py restore --kind qt --arch x64 --destination cpp/.sdk/6.11.0/msvc2022_64_static --github-output $env:GITHUB_OUTPUT --require-msvc
      - if: steps.restore.outputs.hit != 'true'
        run: ./cpp/scripts/build_static_qt.ps1 -Arch x64
      - name: Carry verified SDK forward to this run
        run: python scripts/ci_build_cache.py pack --kind qt --arch x64 --source cpp/.sdk/6.11.0/msvc2022_64_static --bundle "$env:RUNNER_TEMP/qt-x64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/qt-x64/
          compression-level: 0
          overwrite: true
          retention-days: 90

  qt-arm64:
    needs: qt-x64
    runs-on: windows-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qt-x64.outputs.key }}
          path: ${{ runner.temp }}/qt-host
      - run: python scripts/ci_build_cache.py unpack --kind qt --arch x64 --bundle "$env:RUNNER_TEMP/qt-host" --destination cpp/.sdk/6.11.0/msvc2022_64_static --require-msvc
      - id: key
        run: python scripts/ci_build_cache.py key --kind qt --arch arm64 --github-output $env:GITHUB_OUTPUT
      - id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_build_cache.py restore --kind qt --arch arm64 --destination cpp/.sdk/6.11.0/msvc2022_arm64_static --github-output $env:GITHUB_OUTPUT --require-msvc
      - if: steps.restore.outputs.hit != 'true'
        run: ./cpp/scripts/build_static_qt.ps1 -Arch arm64
      - name: Carry verified SDK forward to this run
        run: python scripts/ci_build_cache.py pack --kind qt --arch arm64 --source cpp/.sdk/6.11.0/msvc2022_arm64_static --bundle "$env:RUNNER_TEMP/qt-arm64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/qt-arm64/
          compression-level: 0
          overwrite: true
          retention-days: 90

  build:
    needs: [qt-x64, qt-arm64, branding]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qt-x64.outputs.key }}
          path: ${{ runner.temp }}/qt-x64
      - run: python scripts/ci_build_cache.py unpack --kind qt --arch x64 --bundle "$env:RUNNER_TEMP/qt-x64" --destination cpp/.sdk/6.11.0/msvc2022_64_static --require-msvc
      - if: matrix.arch == 'arm64'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.qt-arm64.outputs.key }}
          path: ${{ runner.temp }}/qt-arm64
      - if: matrix.arch == 'arm64'
        run: |
          python scripts/ci_build_cache.py unpack --kind qt --arch arm64 --bundle "$env:RUNNER_TEMP/qt-arm64" --destination cpp/.sdk/6.11.0/msvc2022_arm64_static --require-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add aarch64-pc-windows-msvc
      - id: key
        name: Identify compiler and incremental cache
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationVersion
          $rust = rustc -V
          "CI_TOOLCHAIN=$vs|$rust" >> $env:GITHUB_ENV
          python scripts/ci_build_cache.py key --kind build --arch ${{ matrix.arch }} --toolchain "$vs|$rust" --github-output $env:GITHUB_OUTPUT
      - name: Restore successful build tree and unchanged-source timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_build_cache.py restore --kind build --arch ${{ matrix.arch }} --toolchain "$env:CI_TOOLCHAIN" --destination cpp/build/ci-${{ matrix.arch }}
      - name: Use the cached Cargo home
        run: '"CARGO_HOME=${{ github.workspace }}/cpp/build/ci-${{ matrix.arch }}/cargo-home" >> $env:GITHUB_ENV'
      - name: Build lite edition
        run: ./cpp/scripts/build.ps1 -Static -Arch ${{ matrix.arch }} -BuildDirectory build/ci-${{ matrix.arch }}
      - name: Incrementally build full edition in the same tree
        run: ./cpp/scripts/build.ps1 -Static -Full -Arch ${{ matrix.arch }} -BuildDirectory build/ci-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.branding.outputs.name }}_lite-cpp-${{ matrix.arch }}
          path: cpp/dist/Release-static${{ matrix.arch == 'arm64' && '-arm64' || '' }}/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.branding.outputs.name }}_pp-cpp-${{ matrix.arch }}
          path: cpp/dist/Release-static${{ matrix.arch == 'arm64' && '-arm64' || '' }}-full/
          if-no-files-found: error
          overwrite: true
      - id: cache-pack
        name: Save incremental compiler outputs
        continue-on-error: true
        run: python scripts/ci_build_cache.py pack --kind build --arch ${{ matrix.arch }} --toolchain "$env:CI_TOOLCHAIN" --source cpp/build/ci-${{ matrix.arch }} --bundle "$env:RUNNER_TEMP/build-cache"
      - if: steps.cache-pack.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.key.outputs.key }}
          path: ${{ runner.temp }}/build-cache/
          compression-level: 0
          overwrite: true
          retention-days: 90

  smoke:
    defaults:
      run:
        shell: powershell
        working-directory: cpp
    # Each exe starts on its own architecture; ARM64 cannot run on the x64 build machine.
    needs: [build, branding]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        variant: [lite, full]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE: ${{ needs.branding.outputs.name }}_${{ matrix.variant == 'full' && 'pp' || 'lite' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.PACKAGE }}-cpp-${{ matrix.arch }}
          path: package
      - run: .\scripts\smoke_static.ps1 -Exe ..\package\${{ env.PACKAGE }}.exe
