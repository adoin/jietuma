[package]
name = "ppocr_rust"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["JYAARU"]
description = "PP-OCR (PaddleOCR) ONNX inference via Rust + ort (det+rec, no opencv/numpy)"

[features]
# ONNX Runtime 不静态链接，运行时由 engine::init_runtime 从给定路径加载（C++ 版用）
load-dynamic = ["ort/load-dynamic"]

[dependencies]
# C++ 按需加载随包 ORT，不依赖复制 DirectML.dll；关闭 copy-dylibs 以避免新版 Cargo 构建目录布局导致的复制失败。
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-24"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false }
imageproc = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
